<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura BCB Economic Lakehouse</title>
  <desc id="desc">API SGS alimenta extração Python, Bronze, Silver e três tabelas Gold no Databricks. Silver também registra rejeições.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#193247" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#193247}.title{font-size:27px;font-weight:700}.subtitle{font-size:14px;fill:#526579}.head{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#526579}.box{fill:white;stroke:#d7e1ea;stroke-width:1.5;filter:url(#shadow)}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="490" fill="url(#background)"/>
  <text x="48" y="54" class="title">BCB Economic Lakehouse</text>
  <text x="48" y="79" class="subtitle">Pipeline sequencial · Databricks Connect + serverless · tabelas Delta no catálogo workspace</text>
  <rect class="box" x="42" y="143" width="190" height="172" rx="16"/>
  <rect x="42" y="143" width="190" height="8" rx="4" fill="#137c91"/>
  <text x="61" y="184" class="head">API SGS · BCB</text>
  <text x="61" y="214" class="body">5 séries reais</text>
  <text x="61" y="239" class="small">HTTP JSON · desde 2020</text>
  <text x="61" y="263" class="small">Extração Python + retry</text>
  <path class="line" d="M235 226 H267"/>
  <rect class="box" x="272" y="143" width="207" height="172" rx="16"/>
  <rect x="272" y="143" width="207" height="8" rx="4" fill="#a66b2b"/>
  <text x="292" y="184" class="head">Bronze</text>
  <text x="292" y="214" class="body">sgs_raw</text>
  <text x="292" y="239" class="small">Dados originais + origem</text>
  <text x="292" y="263" class="small">workspace.bcb_bronze</text>
  <path class="line" d="M482 226 H514"/>
  <rect class="box" x="519" y="143" width="230" height="172" rx="16"/>
  <rect x="519" y="143" width="230" height="8" rx="4" fill="#7b8d9d"/>
  <text x="539" y="184" class="head">Silver</text>
  <text x="539" y="214" class="body">economic_indicators</text>
  <text x="539" y="239" class="small">Tipos · regras · deduplicação</text>
  <text x="539" y="263" class="small">workspace.bcb_silver</text>
  <path class="line" d="M752 226 H784"/>
  <rect class="box" x="789" y="113" width="366" height="232" rx="16"/>
  <rect x="789" y="113" width="366" height="8" rx="4" fill="#dca32a"/>
  <text x="811" y="155" class="head">Gold</text>
  <text x="811" y="185" class="body">monthly_indicators · consolidação</text>
  <text x="811" y="213" class="body">latest_indicators · último valor</text>
  <text x="811" y="241" class="body">economic_features · base mensal</text>
  <text x="811" y="274" class="small">workspace.bcb_gold</text>
  <text x="811" y="304" class="small">Consultas SQL e dashboard a configurar</text>
  <path class="line" d="M634 318 V361"/>
  <rect class="box" x="519" y="366" width="230" height="65" rx="12"/>
  <text x="539" y="392" class="body">data_quality</text>
  <text x="539" y="412" class="small">Registros rejeitados</text>
  <text x="48" y="467" class="small">Full Refresh com overwrite em cada tabela · sem atomicidade entre camadas</text>
</svg>
